name: "Main"
on:
  workflow_dispatch:

# This fork cannot publish immich.dnp.dappnode.eth. That APM repo belongs to
# the upstream DAppNode developer, and the previous release job also used the
# self-hosted ipfs-dev-gateway runner and an internal IPFS node
# (http://10.200.200.7:5001). Run this workflow to build an IPFS hash and
# install that hash on the DAppNode. The package name is unchanged, so a
# higher version updates the installed package and keeps its volumes.
jobs:
  installable-build:
    name: Build installable package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and upload to IPFS
        run: npx @dappnode/dappnodesdk build --provider remote --timeout 1h
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
